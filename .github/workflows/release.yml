name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # actionlint does not support the $/ self-repository syntax yet:
  # https://github.com/rhysd/actionlint/issues/711
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml # zizmor: ignore[self-repository]

  release:
    name: GitHub release
    needs: [ci, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag against versions and main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(jq -r .version custom_components/ccc_waste/manifest.json)"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          for version in "$manifest_version" "$project_version"; do
            if [ "$version" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match version $version in manifest.json or pyproject.toml"
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --generate-notes \
            --title "$TAG" \
            "${prerelease[@]}"
